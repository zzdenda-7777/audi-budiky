name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk out/AudiBudiky.apk
            echo "OK build ${GITHUB_RUN_NUMBER} ${GITHUB_SHA}" > out/STATUS.txt
          else
            echo "FAILED build ${GITHUB_RUN_NUMBER} ${GITHUB_SHA}" > out/STATUS.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AudiBudiky
          path: out/

      - name: Publish to branch "apk"
        if: always()
        run: |
          cd out
          git init -q
          git checkout -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
