<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Audi Diag</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="pill">
    <span class="dot" id="dot"></span>
    <div style="min-width:0">
      <div class="t" id="stT">Odpojeno</div>
      <div class="s" id="stS">Zapoj kabel a zapni zapalování</div>
    </div>
  </div>
  <div class="recb" id="recBadge"><i></i><span id="recTime">0:00</span></div>
  <button class="btn primary" id="btnConn">Připojit</button>
</header>
<div class="banner" id="banner" hidden></div>

<main>
  <!-- JÍZDA -->
  <section class="view on" id="v-drive">
    <div class="pagebar">
      <div class="pages" id="pageChips"></div>
      <button class="ibtn" id="btnHud" aria-label="HUD na čelní sklo"></button>
      <button class="ibtn" id="btnEdit" aria-label="Upravit stránku"></button>
    </div>
    <div class="pagebody" id="pageBody"></div>
  </section>

  <!-- GRAFY -->
  <section class="view" id="v-charts">
    <div class="pagebar">
      <div class="chips" id="spanChips" style="flex:1">
        <button class="chip" data-s="30">30 s</button><button class="chip" data-s="60">1 min</button><button class="chip" data-s="180">3 min</button>
      </div>
      <button class="btn small" id="btnReplay">Přehrát jízdu</button>
    </div>
    <div class="scroll">
      <div class="chart"><h4>Turbo <span class="k"><i style="background:#efe6e3"></i>požad.</span><span class="k"><i style="background:var(--red)"></i>skutečně</span><span class="k">bar</span></h4><canvas id="chBoost"></canvas></div>
      <div class="chart"><h4>Vzduch MAF <span class="k"><i style="background:#efe6e3"></i>požad.</span><span class="k"><i style="background:var(--red)"></i>skutečně</span><span class="k">mg</span></h4><canvas id="chMaf"></canvas></div>
      <div class="chart"><h4>Vstřik a směs <span class="k"><i style="background:var(--red)"></i>vstřik mg</span><span class="k"><i style="background:var(--blue)"></i>vzduch/palivo ÷2</span></h4><canvas id="chIq"></canvas></div>
      <div class="chart"><h4>Otáčky a voda <span class="k"><i style="background:var(--red)"></i>otáčky ÷40</span><span class="k"><i style="background:var(--warn)"></i>voda °C</span></h4><canvas id="chRpm"></canvas></div>
    </div>
  </section>

  <!-- TESTY -->
  <section class="view" id="v-tests"><div class="subhead" id="testsHead" hidden></div><div class="scroll" id="testsBody"></div></section>

  <!-- CESTA -->
  <section class="view" id="v-trip">
    <div class="pagebar"><div class="seg" id="tripSeg" style="flex:1"><button data-m="now" class="on">Teď</button><button data-m="route">Trasa</button><button data-m="hist">Historie</button><button data-m="cmp">Porovnat</button><button data-m="fun">Zábava</button></div></div>
    <div class="scroll" id="tripBody"></div>
  </section>

  <!-- VÍCE -->
  <section class="view" id="v-more"><div class="subhead" id="moreHead" hidden></div><div class="scroll" id="moreBody"></div></section>
</main>

<div class="replay" id="replay" hidden>
  <button class="ibtn" id="rpPlay" aria-label="Pauza"></button>
  <span class="rt" id="rpTime">0:00</span>
  <input type="range" id="rpSeek" min="0" max="1000" value="0" aria-label="Posun v záznamu">
  <button class="chip" id="rpSpeed">×1</button>
  <button class="ibtn" id="rpClose" aria-label="Ukončit přehrávání"></button>
</div>

<div id="pip" hidden></div>
<nav class="nav" id="nav">
  <button data-v="drive" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-6"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg>Jízda</button>
  <button data-v="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 15l4-5 4 3 4-6 4 4"/></svg>Grafy</button>
  <button data-v="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>Testy</button>
  <button data-v="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21l4-18"/><path d="M19 21l-4-18"/><path d="M12 6v2M12 11v2M12 16v2"/></svg>Cesta</button>
  <button data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg>Více<span class="badge" id="navBadge" hidden>0</span></button>
</nav>

<div class="overlay focus" id="focus" hidden></div>
<div class="overlay hud" id="hud" hidden></div>
<div class="overlay guide" id="guide" hidden></div>
<div class="overlay guide" id="picker" hidden></div>
<div class="sheetbg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>
<div class="flash" id="flash"></div>

<script src="js/demo.js"></script>
<script src="js/core.js"></script>
<script src="js/profiles.js"></script>
<script src="js/drive.js"></script>
<script src="js/health.js"></script>
<script src="js/charts.js"></script>
<script src="js/tests.js"></script>
<script src="js/trip.js"></script>
<script src="js/oil.js"></script>
<script src="js/facts.js"></script>
<script src="js/fun.js"></script>
<script src="js/more.js"></script>
<script src="js/hist.js"></script>
<script src="js/pip.js"></script>
<script src="js/night.js"></script>
<script src="js/route.js"></script>
<script src="js/compare.js"></script>
<script src="js/main.js"></script>
</body>
</html>
